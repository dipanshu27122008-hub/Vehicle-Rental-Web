<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create an account on Drivora to rent vehicles or list your fleet." />
  <title>Sign Up | Drivora Marketplace</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/navbar.css" />
  <link rel="stylesheet" href="./css/marketplace.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <style>
    .auth-page-container {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .auth-standalone-card {
      width: min(100%, 500px);
      padding: 2.5rem 2.25rem;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 30px 70px rgba(15, 23, 42, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.95);
    }
  </style>
</head>
<body class="page">
  <header class="header">
    <a href="./index.html" class="logo"><img src="./assets/logo/logo drivora.png" alt="Drivora Logo" /></a>
    <nav class="navbar" aria-label="Primary navigation">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open navigation menu">☰</button>
      <ul class="nav-links" id="primary-navigation">
        <li class="nav-item"><a href="./index.html" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="./about.html" class="nav-link">About</a></li>
        <li class="nav-item"><a href="./vehicles.html" class="nav-link">Vehicles</a></li>
        <li class="nav-item"><a href="./gallery.html" class="nav-link">Gallery</a></li>
        <li class="nav-item"><a href="./contact.html" class="nav-link">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-page-container">
    <div class="auth-standalone-card">
      <div class="auth-header">
        <div class="auth-logo"><i class="fa-solid fa-user-plus"></i></div>
        <h2>Create Your Account</h2>
        <p>Join Drivora to rent premium vehicles or list your fleet as a provider.</p>
      </div>

      <!-- Role Selector Cards -->
      <div class="auth-role-switcher" role="radiogroup" aria-label="Account Role Type">
        <button type="button" class="auth-role-card active" data-role-choice="customer">
          <span class="role-icon">👤</span>
          <strong>Customer Account</strong>
          <small>Rent cars, bikes &amp; EVs</small>
        </button>
        <button type="button" class="auth-role-card" data-role-choice="provider">
          <span class="role-icon">🏢</span>
          <strong>Vehicle Provider</strong>
          <small>List fleet &amp; earn revenue</small>
        </button>
      </div>

      <div id="page-signup-error" class="form-error" role="alert" style="color:#b91c1c; font-size:0.86rem; margin-bottom:1rem; text-align:center;"></div>

      <form id="standalone-signup-form" novalidate>
        <input type="hidden" id="page-selected-role" name="requestedRole" value="customer" />

        <div class="glass-field" style="margin-bottom:0.75rem;">
          <label for="page-signup-name">Full Legal Name *</label>
          <input id="page-signup-name" name="fullName" type="text" required placeholder="e.g. Rahul Sharma" autocomplete="name" />
        </div>

        <!-- Provider Specific Fields -->
        <div id="page-provider-fields" style="display:none; margin-bottom:0.75rem; padding:0.85rem; background:rgba(239,246,255,0.7); border-radius:14px; border:1px solid rgba(191,219,254,0.8);">
          <div class="glass-field" style="margin-bottom:0.6rem;">
            <label for="page-signup-business">Shop / Dealership Business Name *</label>
            <input id="page-signup-business" name="businessName" type="text" placeholder="e.g. Rajputana Luxury Mobility" />
          </div>
          <div class="glass-field">
            <label for="page-signup-city">Operating Hub City *</label>
            <select id="page-signup-city" name="city">
              <option value="Jaipur">Jaipur</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Delhi NCR">Delhi NCR</option>
              <option value="Bengaluru">Bengaluru</option>
              <option value="Pune">Pune</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Chennai">Chennai</option>
              <option value="Ahmedabad">Ahmedabad</option>
              <option value="Udaipur">Udaipur</option>
            </select>
          </div>
        </div>

        <div class="glass-field" style="margin-bottom:0.75rem;">
          <label for="page-signup-email">Email Address *</label>
          <input id="page-signup-email" name="email" type="email" required placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="glass-field" style="margin-bottom:0.75rem;">
          <label for="page-signup-phone">10-Digit Mobile Number *</label>
          <input id="page-signup-phone" name="phone" type="tel" inputmode="numeric" required placeholder="9876543210" autocomplete="tel" />
        </div>

        <div class="glass-field" style="margin-bottom:0.75rem;">
          <label for="page-signup-password">Password (minimum 6 characters) *</label>
          <div class="password-input-group">
            <input id="page-signup-password" name="password" type="password" required minlength="6" placeholder="Choose a secure password" autocomplete="new-password" />
            <button type="button" class="btn-toggle-pw" aria-label="Show or hide password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <label class="terms-checkbox-row" style="margin-top:0.75rem; margin-bottom:1rem; display:flex; align-items:flex-start; gap:0.5rem; font-size:0.84rem; color:#475569; cursor:pointer;">
          <input type="checkbox" id="page-signup-terms" required style="margin-top:0.2rem;" />
          <span id="page-signup-terms-text">I accept the <a href="./terms.html" target="_blank" style="color:#2563eb; font-weight:700;">Terms &amp; Conditions</a> and Privacy Guidelines.</span>
        </label>

        <button type="submit" id="btn-page-signup-submit" class="btn-glass btn-glass-primary" style="width:100%; justify-content:center; padding:0.8rem; border-radius:14px; font-size:0.95rem;">
          <i class="fa-solid fa-user-check"></i> Create Account
        </button>
      </form>

      <div class="auth-switch-footer">
        Already have an account? <a href="./signin.html" id="link-to-signin"><strong>Sign In here</strong></a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Drivora Vehicle Rental Marketplace. All rights reserved.</p>
  </footer>

  <script src="./js/navbar.js"></script>
  <script src="./js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("standalone-signup-form");
      const errEl = document.getElementById("page-signup-error");
      const submitBtn = document.getElementById("btn-page-signup-submit");
      const roleCards = document.querySelectorAll(".auth-role-card");
      const roleInput = document.getElementById("page-selected-role");
      const providerFields = document.getElementById("page-provider-fields");
      const businessInput = document.getElementById("page-signup-business");

      // Check URL search params for role
      const params = new URLSearchParams(window.location.search);
      const preRole = params.get("role") === "provider" ? "provider" : "customer";
      setRole(preRole);

      roleCards.forEach((card) => {
        card.addEventListener("click", () => {
          const role = card.getAttribute("data-role-choice");
          setRole(role);
        });
      });

      function setRole(role) {
        roleCards.forEach((c) => c.classList.toggle("active", c.getAttribute("data-role-choice") === role));
        roleInput.value = role;
        const termsText = document.getElementById("page-signup-terms-text");
        if (role === "provider") {
          providerFields.style.display = "block";
          businessInput.required = true;
          if (termsText) {
            termsText.innerHTML = 'I accept the <a href="./terms.html?tab=provider" target="_blank" style="color:#2563eb; font-weight:700;">Provider Commercial Terms (v1.0)</a>, Marketplace Terms &amp; Conditions, and Privacy Guidelines.';
          }
        } else {
          providerFields.style.display = "none";
          businessInput.required = false;
          if (termsText) {
            termsText.innerHTML = 'I accept the <a href="./terms.html" target="_blank" style="color:#2563eb; font-weight:700;">Terms &amp; Conditions</a> and Privacy Guidelines.';
          }
        }
      }

      // Password toggle
      document.querySelectorAll(".btn-toggle-pw").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = btn.previousElementSibling;
          if (!input) return;
          const isPw = input.type === "password";
          input.type = isPw ? "text" : "password";
          btn.innerHTML = isPw ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
        });
      });

      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          errEl.textContent = "";

          const fd = Object.fromEntries(new FormData(form).entries());
          const cleanPhone = String(fd.phone || "").replace(/\D/g, "");
          if (cleanPhone.length < 10) {
            errEl.textContent = "Please enter a valid 10-digit mobile number.";
            return;
          }
          if (!document.getElementById("page-signup-terms").checked) {
            errEl.textContent = "You must accept the Drivora terms to continue.";
            return;
          }
          if (roleInput.value === "provider" && !fd.businessName?.trim()) {
            errEl.textContent = "Please enter your Dealership or Business Name.";
            return;
          }

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

          try {
            const res = await fetch("/api/marketplace?action=auth", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                authOperation: "register",
                fullName: fd.fullName.trim(),
                email: fd.email.trim(),
                password: fd.password,
                phone: cleanPhone,
                requestedRole: roleInput.value,
                businessName: fd.businessName ? fd.businessName.trim() : undefined,
                city: fd.city,
              }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) {
              throw new Error(data.error || "Failed to create account.");
            }
            if (window.DrivoraAuth && typeof window.DrivoraAuth.setSession === "function") {
              window.DrivoraAuth.setSession({
                accessToken: data.accessToken,
                refreshToken: data.refreshToken,
                user: data.user,
              });
            }
            if (data.user.role === "provider") {
              window.location.href = "./provider-dashboard.html";
            } else {
              window.location.href = "./vehicles.html";
            }
          } catch (err) {
            errEl.textContent = err.message;
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-user-check"></i> Create Account';
          }
        });
      }
    });
  </script>
</body>
</html>
